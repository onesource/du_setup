name: Shell Script Linter

permissions:
  contents: read

on:
  push:
    branches: [ "main", "test", "dev"]
  pull_request:
    branches: [ "main" ]

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run Shellcheck
        run: |
          set -o pipefail

          # Check main script and all modules
          files_to_check=$(find . -type f -name "*.sh" -not -path "./.git/*" | sort)

          if [ -z "$files_to_check" ]; then
            echo "No .sh files found to check."
            exit 0
          fi

          echo "--- Shell script files to check ---"
          echo "$files_to_check"
          echo ""

          echo "--- Checking for all warnings and style issues ---"
          echo "$files_to_check" | xargs shellcheck -f gcc | while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1)
            line_no=$(echo "$line" | cut -d: -f2)
            message=$(echo "$line" | cut -d: -f4-)
            echo "::warning file=$file,line=$line_no::$message"
          done || true

          echo "--- Checking for critical errors ---"
          echo "$files_to_check" | xargs shellcheck --severity=error

          echo "--- Checking module sourcing order ---"
          # Verify that main script sources all modules in correct order
          if [ -f "du_setup_modular.sh" ]; then
            echo "Checking module dependencies in du_setup_modular.sh..."
            # Extract sourced files from main script and resolve $SCRIPT_DIR
            sourced_files=$(grep "^source " du_setup_modular.sh | grep -E "(lib/|modules/)" | sed 's/\$SCRIPT_DIR/./g' | awk '{print $2}' | tr -d '"' | tr -d "'" | sort)

            # Check if all referenced files exist
            missing_files=""
            for file in $sourced_files; do
              if [ ! -f "$file" ]; then
                missing_files="$missing_files $file"
              fi
            done

            if [ -n "$missing_files" ]; then
              echo "::error::Missing referenced module files:$missing_files"
              exit 1
            else
              echo "All referenced module files exist."
            fi
          fi
