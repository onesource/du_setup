# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '44 7 * * 0'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    runs-on: ubuntu-latest
    name: Codacy Security Scan
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reject CRLF shell scripts
        shell: bash
        run: |
          mapfile -t bad_files < <(grep -Il $'\r' -- *.sh lib/*.sh modules/*.sh || true)
          if (( ${#bad_files[@]} )); then
            printf 'CRLF shell script: %s\n' "${bad_files[@]}"
            exit 1
          fi

      - name: Validate Bash syntax
        shell: bash
        run: |
          for script in du_setup_modular.sh lib/*.sh modules/*.sh; do
            bash -n "$script"
          done

      - name: Test reconciler helpers
        shell: bash
        run: tests/test_reconciler_helpers.sh

      - name: Run ShellCheck errors gate
        shell: bash
        run: shellcheck -x --severity=error du_setup_modular.sh lib/*.sh modules/*.sh

      - name: Report ShellCheck warnings
        continue-on-error: true
        shell: bash
        run: shellcheck -x --severity=warning du_setup_modular.sh lib/*.sh modules/*.sh

      - name: Check for non-UTF-8 files
        run: |
          echo "Checking for non-UTF-8 files in shell scripts..."
          find . -name .git -prune -o -type f -name "*.sh" -exec file --mime {} + | grep -v -e 'charset=utf-8' -e 'charset=us-ascii' -e 'charset=binary' || echo "All shell script files OK"

          echo "Checking for non-UTF-8 files in configuration files..."
          find . -name .git -prune -o -type f \( -name "*.yml" -o -name "*.yaml" -o -name "*.json" -o -name "*.md" \) -exec file --mime {} + | grep -v -e 'charset=utf-8' -e 'charset=us-ascii' -e 'charset=binary' || echo "All configuration files OK"

      - name: Validate script structure
        run: |
          echo "Validating modular script structure..."

          # Check if main script exists
          if [ ! -f "du_setup_modular.sh" ]; then
            echo "::error::Main script du_setup_modular.sh not found"
            exit 1
          fi

          # Check if lib directory exists and has required files
          if [ ! -d "lib" ]; then
            echo "::error::lib directory not found"
            exit 1
          fi

          required_lib_files=("config.sh" "utils.sh")
          for file in "${required_lib_files[@]}"; do
            if [ ! -f "lib/$file" ]; then
              echo "::error::Required lib file lib/$file not found"
              exit 1
            fi
          done

          # Check if modules directory exists
          if [ ! -d "modules" ]; then
            echo "::error::modules directory not found"
            exit 1
          fi

          # Verify main script sources all required files
          echo "Checking that main script sources all modules..."
          sourced_modules=$(grep "^source " du_setup_modular.sh | grep -E "(lib/|modules/)" | wc -l)
          if [ "$sourced_modules" -lt 10 ]; then
            echo "::warning::Expected at least 10 sourced modules, found $sourced_modules"
          fi

          echo "Script structure validation completed"

      # # Execute Codacy Analysis CLI and generate a SARIF output with the security issues identified during the analysis
      # - name: Run Codacy Analysis CLI
      #   uses: codacy/codacy-analysis-cli-action@d43360362776a6789b47b99ae8973510854e2d3d # master, pinned 2026-07-28
      #   with:
      #     # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
      #     # You can also omit the token and run the tools that support default configurations
      #     project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
      #     verbose: true
      #     output: results.sarif
      #     format: sarif
      #     # Adjust severity of non-security issues
      #     gh-code-scanning-compat: true
      #     # Force 0 exit code to allow SARIF file generation
      #     # This will handover control about PR rejection to the GitHub side
      #     max-allowed-issues: 2147483647

      # # Upload the SARIF file generated in the previous step
      # - name: Upload SARIF results file
      #   uses: github/codeql-action/upload-sarif@3b0bd1d116c0bde30213346b22d4f634d96a2fb0 # v3
      #   with:
      #     sarif_file: results.sarif
      #     # Use a unique category to avoid conflicts with other security scans
      #     category: codacy-security-scan-${{ github.run_id }}

      # === Codacy per-tool runs ===
      - name: Run Codacy (Pylint)
        uses: codacy/codacy-analysis-cli-action@d43360362776a6789b47b99ae8973510854e2d3d # master, pinned 2026-07-28
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          tool: pylint
          format: sarif
          output: results-pylint.sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF (Pylint)
        if: ${{ hashFiles('results-pylint.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@3b0bd1d116c0bde30213346b22d4f634d96a2fb0 # v3
        with:
          sarif_file: results-pylint.sarif
          category: codacy-pylint

      - name: Run Codacy (ShellCheck)
        uses: codacy/codacy-analysis-cli-action@d43360362776a6789b47b99ae8973510854e2d3d # master, pinned 2026-07-28
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          tool: shellcheck
          format: sarif
          output: results-shellcheck.sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF (ShellCheck)
        if: ${{ hashFiles('results-shellcheck.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@3b0bd1d116c0bde30213346b22d4f634d96a2fb0 # v3
        with:
          sarif_file: results-shellcheck.sarif
          category: codacy-shellcheck

      - name: Run Codacy (Bandit)
        uses: codacy/codacy-analysis-cli-action@d43360362776a6789b47b99ae8973510854e2d3d # master, pinned 2026-07-28
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          tool: bandit
          format: sarif
          output: results-bandit.sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF (Bandit)
        if: ${{ hashFiles('results-bandit.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@3b0bd1d116c0bde30213346b22d4f634d96a2fb0 # v3
        with:
          sarif_file: results-bandit.sarif
          category: codacy-bandit

      - name: Run Codacy (Trivy)
        uses: codacy/codacy-analysis-cli-action@d43360362776a6789b47b99ae8973510854e2d3d # master, pinned 2026-07-28
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          tool: trivy
          format: sarif
          output: results-trivy.sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF (Trivy)
        if: ${{ hashFiles('results-trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@3b0bd1d116c0bde30213346b22d4f634d96a2fb0 # v3
        with:
          sarif_file: results-trivy.sarif
          category: codacy-trivy